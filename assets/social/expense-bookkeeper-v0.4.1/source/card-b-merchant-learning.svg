<title id="title">Expense Bookkeeper synthetic merchant learning evidence</title>
<desc id="desc">Synthetic Expense Bookkeeper evidence card showing Corner Cafe explicitly taught as Dining and Cafe, then CORNER CAFE DOWNTOWN resolved to the same local rule. Guardrails show auto-promotion off, conflicts requiring approval, rollback available, no live data, and no live ledger write.</desc>
<rect x="0" y="0" width="1600" height="2000" rx="0" fill="#EEF7EE" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1600" height="410" rx="0" fill="#142236" stroke="none" stroke-width="0"/><text x="72" y="70" fill="#8DCBC2" font-family="SFMono-Regular, Menlo, monospace" font-size="22" font-weight="650" text-anchor="start" letter-spacing="1.4">EXPENSE BOOKKEEPER  /  SYNTHETIC PROOF</text><text x="1528" y="70" fill="#AAB9C8" font-family="SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600" text-anchor="end" letter-spacing="0">02 / 02</text><text x="72" y="170" fill="#FFFFFF" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="66" font-weight="780" letter-spacing="-1.2"><tspan x="72" dy="0">ONE CORRECTION TAUGHT.</tspan><tspan x="72" dy="82">THE NEXT VARIANT RESOLVED.</tspan></text><text x="72" y="370" fill="#A7D9D1" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="29" font-weight="520" text-anchor="start" letter-spacing="0">Local learning with visible approval and rollback boundaries</text><rect x="72" y="450" width="1456" height="265" rx="28" fill="#FBFDF9" stroke="#C5D9C6" stroke-width="2"/><text x="112" y="505" fill="#176966" font-family="SFMono-Regular, Menlo, monospace" font-size="20" font-weight="750" text-anchor="start" letter-spacing="1.5">EXPLICIT CORRECTION</text><text x="112" y="600" fill="#142236" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="54" font-weight="800" text-anchor="start" letter-spacing="0">Corner Cafe</text><text x="690" y="600" fill="#238480" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="54" font-weight="700" text-anchor="start" letter-spacing="0">→</text><rect x="790" y="535" width="650" height="104" rx="22" fill="#D8EBE1" stroke="none" stroke-width="0"/><text x="835" y="602" fill="#176966" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="42" font-weight="780" text-anchor="start" letter-spacing="0">Dining  /  Cafe</text><text x="112" y="670" fill="#5B6B7D" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="25" font-weight="540" text-anchor="start" letter-spacing="0">Confirmed by the user • stored as a local merchant rule</text><rect x="72" y="755" width="1456" height="310" rx="28" fill="#FFFFFF" stroke="#C5D9C6" stroke-width="2"/><text x="112" y="810" fill="#3E70B5" font-family="SFMono-Regular, Menlo, monospace" font-size="20" font-weight="750" text-anchor="start" letter-spacing="1.5">NEXT VARIANT  /  RESOLUTION RECEIPT</text><text x="112" y="900" fill="#142236" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="43" font-weight="790" text-anchor="start" letter-spacing="0">CORNER CAFE DOWNTOWN</text><rect x="1138" y="846" width="302" height="52" rx="26" fill="#DCE8F6" stroke="none" stroke-width="2"/><text x="1289" y="881" fill="#3E70B5" font-family="SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1.2">MATCHED LOCAL RULE</text><line x1="112" y1="945" x2="1488" y2="945" stroke="#C5D9C6" stroke-width="2"/><text x="112" y="1012" fill="#5B6B7D" font-family="SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" text-anchor="start" letter-spacing="1">MATCH</text><text x="350" y="1012" fill="#142236" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="29" font-weight="720" text-anchor="start" letter-spacing="0">corner cafe</text><text x="760" y="1012" fill="#5B6B7D" font-family="SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" text-anchor="start" letter-spacing="1">RESULT</text><text x="970" y="1012" fill="#176966" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="31" font-weight="780" text-anchor="start" letter-spacing="0">Dining / Cafe</text><rect x="72" y="1110" width="700" height="224" rx="26" fill="#FFFFFF" stroke="#C5D9C6" stroke-width="2"/><rect x="72" y="1110" width="12" height="224" rx="6" fill="#238480" stroke="none" stroke-width="0"/><circle cx="134" cy="1166" r="31" fill="#238480"/><text x="134" y="1174" fill="#FFFFFF" font-family="SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0">01</text><text x="184" y="1174" fill="#142236" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="24" font-weight="780" text-anchor="start" letter-spacing="0">AUTO-PROMOTION OFF</text><rect x="106" y="1212" width="632" height="88" rx="18" fill="#D8EBE1" stroke="none" stroke-width="0"/><text x="128" y="1247" fill="#142236" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="22" font-weight="560" letter-spacing="0"><tspan x="128" dy="0">Repeated observations do not become</tspan><tspan x="128" dy="30">rules unless the user opts in.</tspan></text><rect x="808" y="1110" width="720" height="224" rx="26" fill="#FFFFFF" stroke="#C5D9C6" stroke-width="2"/><rect x="808" y="1110" width="12" height="224" rx="6" fill="#CF5638" stroke="none" stroke-width="0"/><circle cx="870" cy="1166" r="31" fill="#CF5638"/><text x="870" y="1174" fill="#FFFFFF" font-family="SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0">02</text><text x="920" y="1174" fill="#142236" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="24" font-weight="780" text-anchor="start" letter-spacing="0">CONFLICTS REQUIRE APPROVAL</text><rect x="842" y="1212" width="652" height="88" rx="18" fill="#F4D9CF" stroke="none" stroke-width="0"/><text x="864" y="1247" fill="#142236" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="22" font-weight="560" letter-spacing="0"><tspan x="864" dy="0">A conflicting category creates a</tspan><tspan x="864" dy="30">proposal; the trusted rule stays.</tspan></text><rect x="72" y="1365" width="700" height="224" rx="26" fill="#FFFFFF" stroke="#C5D9C6" stroke-width="2"/><rect x="72" y="1365" width="12" height="224" rx="6" fill="#BB7B0B" stroke="none" stroke-width="0"/><circle cx="134" cy="1421" r="31" fill="#BB7B0B"/><text x="134" y="1429" fill="#FFFFFF" font-family="SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0">03</text><text x="184" y="1429" fill="#142236" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="24" font-weight="780" text-anchor="start" letter-spacing="0">ROLLBACK AVAILABLE</text><rect x="106" y="1467" width="632" height="88" rx="18" fill="#F3E6C7" stroke="none" stroke-width="0"/><text x="128" y="1502" fill="#142236" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="22" font-weight="560" letter-spacing="0"><tspan x="128" dy="0">The learned rule was rolled back in</tspan><tspan x="128" dy="30">a separate synthetic proof step.</tspan></text><rect x="808" y="1365" width="720" height="224" rx="26" fill="#FFFFFF" stroke="#C5D9C6" stroke-width="2"/><rect x="808" y="1365" width="12" height="224" rx="6" fill="#3E70B5" stroke="none" stroke-width="0"/><circle cx="870" cy="1421" r="31" fill="#3E70B5"/><text x="870" y="1429" fill="#FFFFFF" font-family="SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0">04</text><text x="920" y="1429" fill="#142236" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="24" font-weight="780" text-anchor="start" letter-spacing="0">LOCAL STATE ONLY</text><rect x="842" y="1467" width="652" height="88" rx="18" fill="#DCE8F6" stroke="none" stroke-width="0"/><text x="864" y="1502" fill="#142236" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="22" font-weight="560" letter-spacing="0"><tspan x="864" dy="0">No cloud model, live sheet, or</tspan><tspan x="864" dy="30">personal transaction was used.</tspan></text><rect x="72" y="1635" width="1456" height="235" rx="28" fill="#142236" stroke="none" stroke-width="0"/><text x="112" y="1690" fill="#91D0C7" font-family="SFMono-Regular, Menlo, monospace" font-size="20" font-weight="750" text-anchor="start" letter-spacing="1.5">EVIDENCE CHAIN</text><text x="112" y="1750" fill="#FFFFFF" font-family="SFMono-Regular, Menlo, monospace" font-size="28" font-weight="690" letter-spacing="0"><tspan x="112" dy="0">CORRECT  →  LEARN LOCAL RULE  →  RESOLVE VARIANT</tspan><tspan x="112" dy="48">CONFLICT  →  WAIT FOR APPROVAL  •  ROLLBACK  →  RESTORE</tspan></text><text x="112" y="1840" fill="#A7D9D1" font-family="SFMono-Regular, Menlo, monospace" font-size="20" font-weight="650" text-anchor="start" letter-spacing="0.8">SYNTHETIC TEMP STATE  •  NO LIVE DATA  •  NO LIVE LEDGER WRITE</text><line x1="72" y1="1930" x2="1528" y2="1930" stroke="#C5D9C6" stroke-width="2"/><text x="72" y="1970" fill="#5B6B7D" font-family="SFMono-Regular, Menlo, monospace" font-size="18" font-weight="650" text-anchor="start" letter-spacing="0">m83iyer / expense-bookkeeper</text><text x="1528" y="1970" fill="#5B6B7D" font-family="SFMono-Regular, Menlo, monospace" font-size="18" font-weight="650" text-anchor="end" letter-spacing="0">SOURCE 2e69db9f  •  v0.4.1</text>

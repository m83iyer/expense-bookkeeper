<title id="title">Expense Bookkeeper synthetic capture review evidence</title>
<desc id="desc">Synthetic Expense Bookkeeper evidence card showing an AED 155.40 ExampleCard alert for XYZ123 UNKNOWN parsed into a retained review row. The visible result is category Misc, subcategory Other, status Review, with no personal data and no live ledger write.</desc>

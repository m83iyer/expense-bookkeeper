2" y="1625" fill="#FFFFFF" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="42" font-weight="790" text-anchor="start" letter-spacing="0">UNKNOWN ≠ DROPPED</text><text x="710" y="1584" fill="#D9E3EC" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="27" font-weight="520" letter-spacing="0"><tspan x="710" dy="0">The parser preserved the transaction, used the</tspan><tspan x="710" dy="39">Misc / Other fallback, and surfaced uncertainty.</tspan></text><rect x="72" y="1745" width="1456" height="145" rx="24" fill="#FBFDF9" stroke="#C5D9C6" stroke-width="2"/><text x="112" y="1792" fill="#CF5638" font-family="SFMono-Regular, Menlo, monospace" font-size="18" font-weight="750" text-anchor="start" letter-spacing="1.3">PROOF BOUNDARY</text><text x="112" y="1838" fill="#142236" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="23" font-weight="560" letter-spacing="0"><tspan x="112" dy="0">Deterministic synthetic input • no live sheet, credential, relay,</tspan><tspan x="112" dy="32">or personal transaction accessed • NO LIVE LEDGER WRITE</tspan></text><line x1="72" y1="1930" x2="1528" y2="1930" stroke="#C5D9C6" stroke-width="2"/><text x="72" y="1970" fill="#5B6B7D" font-family="SFMono-Regular, Menlo, monospace" font-size="18" font-weight="650" text-anchor="start" letter-spacing="0">m83iyer / expense-bookkeeper</text><text x="1528" y="1970" fill="#5B6B7D" font-family="SFMono-Regular, Menlo, monospace" font-size="18" font-weight="650" text-anchor="end" letter-spacing="0">SOURCE 2e69db9f  •  v0.4.1</text>
